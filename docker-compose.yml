services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finpilot-ai-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ./data/finpilot.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
